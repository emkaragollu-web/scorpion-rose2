        radial-gradient(
            circle,
            rgba(255,70,100,.13),

        transform: scale(1.15);

    }
}

        textAppear 2s 5s forwards,
        textGlow 3s 7s infinite alternate;

@keyframes textAppear {
    from {
        opacity: 0;
        transform: translateY(-30px);

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes textGlow {

<script>

/* =================================================
   SCORPION MOUSE TAKİBİ
================================================= */

const scorpion =
    document.getElementById("scorpion");

const legs =
    document.querySelectorAll(".leg");

let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;

let x = mouseX - 250;
let y = mouseY;

let rotation = 0;

document.addEventListener("mousemove", e => {

    mouseX = e.clientX;
    mouseY = e.clientY;

});


function animate(time) {

    const dx = mouseX - x;
    const dy = mouseY - y;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    const targetX =
        mouseX -
        (dx / Math.max(distance, 1)) * 90;

    const targetY =
        mouseY -
        (dy / Math.max(distance, 1)) * 90;

    x += (targetX - x) * .055;
    y += (targetY - y) * .055;


    /* Dönüş */

    const targetRotation =
        Math.atan2(dy, dx) *
        180 / Math.PI + 90;

    let difference =
        targetRotation - rotation;

    difference =
        ((difference + 180) % 360) - 180;

    rotation += difference * .08;


    scorpion.style.left = x + "px";
    scorpion.style.top = y + "px";

    scorpion.style.transform =
        `translate(-50%, -50%)
         rotate(${rotation}deg)`;


    /* 8 bacak yürüyüşü */

    const speed =
        Math.min(distance / 30, 1);

    const walk =
        Math.sin(time * .025) *
        18 * speed;


    legs.forEach((leg, i) => {

        const phase =
            i % 2 === 0 ? 1 : -1;

        let base = 0;

        if (leg.classList.contains("left1"))
            base = 25;

        if (leg.classList.contains("left2"))
            base = 7;

        if (leg.classList.contains("left3"))
            base = -10;

        if (leg.classList.contains("left4"))
            base = -28;

        if (leg.classList.contains("right1"))
            base = -25;

        if (leg.classList.contains("right2"))
            base = -7;

        if (leg.classList.contains("right3"))
            base = 10;

        if (leg.classList.contains("right4"))
            base = 28;

        leg.style.transform =
            `rotate(${base + walk * phase}deg)`;
    });


    /* Kuyruk */

    const tail =
        document.querySelector(".tail");

    const tail2 =
        document.querySelector(".tail2");

    const wave =
        Math.sin(time * .008) * 8;

    tail.style.transform =
        `rotate(${-25 + wave}deg)`;

    tail2.style.transform =
        `rotate(${-25 - wave}deg)`;


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);


/* Akrep izi */

setInterval(() => {

    const dot =
        document.createElement("div");

    dot.className = "trail";

    dot.style.left = x + "px";
    dot.style.top = y + "px";

    document.body.appendChild(dot);

    setTimeout(() => {
        dot.remove();
    }, 800);

}, 70);

</script>
